<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-300px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .beam-line { stroke-dasharray: 80 120; animation: pulseBeam 5s linear infinite; }
      .scanner-beam { animation: waveScan 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .beacon-dot { animation: blinkBeacon 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Geometric Grid Background (Circuit/Telemetry vibe) -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.2" fill="none">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 120 0 L 120 340 M 240 0 L 240 340 M 360 0 L 360 340 M 480 0 L 480 340 M 600 0 L 600 340 M 720 0 L 720 340 M 840 0 L 840 340 M 960 0 L 960 340 M 1080 0 L 1080 340" />
  </g>

  <!-- Ambient Blurred Radial Blobs (Underneath text) -->
  <circle cx="200" cy="80" r="130" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="240" r="150" fill="#a855f7" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="170" r="180" fill="#6366f1" opacity="0.06" filter="url(#glow)" />

  <!-- Dynamic / Animated Flowing Telemetry Beams (In Background) -->
  <g fill="none">
    <path class="beam-line" d="M -50 90 Q 250 140 550 80 T 1250 110" stroke="#0ea5e9" stroke-width="2.5" opacity="0.4" />
    <path class="beam-line" d="M -50 260 Q 300 200 650 270 T 1250 230" stroke="#8b5cf6" stroke-width="2" opacity="0.35" style="animation-duration: 7s;" />
  </g>

  <!-- Light Scan Wave Sweeper (Background only) -->
  <rect class="scanner-beam" y="0" width="160" height="340" fill="url(#pulseCyan)" />

  <!-- Animated Floating Data Nodes (Deep background) -->
  <g class="particle-1">
    <circle cx="160" cy="70" r="4" fill="#38bdf8" />
    <line x1="160" y1="70" x2="220" y2="105" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  </g>
  <g class="particle-2">
    <circle cx="1040" cy="85" r="4" fill="#c084fc" />
    <circle cx="1110" cy="140" r="3" fill="#818cf8" />
    <line x1="1040" y1="85" x2="1110" y2="140" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
  </g>
  <g class="particle-3">
    <circle cx="980" cy="270" r="4.5" fill="#34d399" />
  </g>

  <!-- Live Status Beacons (Subtle pulsing indicator in background corners) -->
  <circle class="beacon-dot" cx="60" cy="45" fill="#10b981" />
  <circle cx="60" cy="45" r="7" stroke="#10b981" stroke-width="1" fill="none" opacity="0.4" />
  <text x="76" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">PIPELINE OBSERVABILITY MATRIX</text>

  <!-- Foreground Content Container (Guaranteed above all visual dynamics) -->

  <!-- Top Badge Capsule -->
  <g transform="translate(60, 80)">
    <rect width="250" height="30" rx="15" fill="url(#badgeGradient)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <circle cx="18" cy="15" r="4.5" fill="#38bdf8" />
    <text x="32" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CI/CD TEST INTELLIGENCE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="158" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome Test Execution Log Aggregation
  </text>
  <text x="60" y="198" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.3">
    &amp; Distributed Failure Analytics
  </text>

  <!-- Subtitle / Meta Description -->
  <text x="60" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Curated Hub for Centralized Test Telemetry, Flaky Detection, Root-Cause Triage &amp; Open-Source Log Pipelines
  </text>

  <!-- Bottom Pills: Tech Capabilities -->
  <g transform="translate(60, 274)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Real-Time Ingest</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(158, 0)">
      <rect width="158" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 Flaky Triage &amp; AI</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(328, 0)">
      <rect width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 OpenTelemetry / OTLP</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(510, 0)">
      <rect width="152" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Enterprise SIEM</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(674, 0)">
      <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐧 Open-Source</text>
    </g>
  </g>
</svg>
